<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Food List</title>
</head>

<body>

<h1>Foods</h1>

<div id="food_list">

    <div th:each="food : ${food_list}">

        <h2 th:text="${food.name}">Food name</h2>

        <p>
            <strong>Brand:</strong>
            <span th:text="${food.brand}">Brand</span>
        </p>

        <p>
            <strong>Barcode:</strong>
            <span th:text="${food.barcode}">Barcode</span>
        </p>

        <p>
            <strong>Type:</strong>
            <span th:text="${food.type}">Type</span>
        </p>

        <h3>Nutrition</h3>

        <p>
            <strong>Calories:</strong>
            <span th:text="${food.calories}">0</span> kcal
        </p>

        <p>
            <strong>Protein:</strong>
            <span th:text="${food.proteinGrams}">0</span> g
        </p>

        <p>
            <strong>Carbohydrates:</strong>
            <span th:text="${food.carbohydratesGrams}">0</span> g
        </p>

        <p>
            <strong>Fat:</strong>
            <span th:text="${food.fatGrams}">0</span> g
        </p>

        <p>
            <strong>Sugar:</strong>
            <span th:text="${food.sugarGrams}">0</span> g
        </p>

        <p>
            <strong>Fiber:</strong>
            <span th:text="${food.fiberGrams}">0</span> g
        </p>

        <p>
            <strong>Salt:</strong>
            <span th:text="${food.saltGrams}">0</span> g
        </p>

        <p>
            <strong>Saturated fat:</strong>
            <span th:text="${food.saturatedFatGrams}">0</span> g
        </p>

        <hr>

    </div>

</div>

</body>
</html>
