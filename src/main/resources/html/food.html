<!DOCTYPE html>

<html lang="da" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chicken</title>
</head>

<body>

<h1>Chicken</h1>

<div th:if="${food != null}">

    <h2 th:text="${food.name}">Chicken</h2>

    <p>
        <strong>Brand:</strong>
        <span th:text="${food.brand}">Brand</span>
    </p>

    <p>
        <strong>Barcode:</strong>
        <span th:text="${food.barcode}">Barcode</span>
    </p>

    <p>
        <strong>Quantity:</strong>
        <span th:text="${food.quantity}">Quantity</span>
    </p>

    <h3>Nutrition per 100g</h3>

    <p>
        <strong>Calories:</strong>
        <span th:text="${food.nutriments.getOrZero(food.nutriments.energyKcal)}">
            0
        </span> kcal
    </p>

    <p>
        <strong>Protein:</strong>
        <span th:text="${food.nutriments.getOrZero(food.nutriments.protein)}">
            0
        </span> g
    </p>

    <p>
        <strong>Carbohydrates:</strong>
        <span th:text="${food.nutriments.getOrZero(food.nutriments.carbohydrates)}">
            0
        </span> g
    </p>

    <p>
        <strong>Fat:</strong>
        <span th:text="${food.nutriments.getOrZero(food.nutriments.fat)}">
            0
        </span> g
    </p>

    <p>
        <strong>Sugar:</strong>
        <span th:text="${food.nutriments.getOrZero(food.nutriments.sugars)}">
            0
        </span> g
    </p>

    <p>
        <strong>Fiber:</strong>
        <span th:text="${food.nutriments.getOrZero(food.nutriments.fiber)}">
            0
        </span> g
    </p>

    <p>
        <strong>Salt:</strong>
        <span th:text="${food.nutriments.getOrZero(food.nutriments.salt)}">
            0
        </span> g
    </p>

    <p>
        <strong>Saturated fat:</strong>
        <span th:text="${food.nutriments.getOrZero(food.nutriments.saturatedFat)}">
            0
        </span> g
    </p>

    <div th:if="${food.imageUrl != null}">
        <h3>Image</h3>

        <img
                th:src="${food.imageUrl}"
                th:alt="${food.name}"
                width="250"
        >
    </div>

</div>

<div th:if="${food == null}">
    <p>Ingen produkter fundet.</p>
</div>

</body>
</html>
